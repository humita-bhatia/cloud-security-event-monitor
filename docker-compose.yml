services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_PATH: /data/security.db
    volumes:
      - db_data:/data
    depends_on:
      - redis
  worker:
    build: .
    command: python worker.py
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_PATH: /data/security.db
    volumes:
      - db_data:/data
    depends_on:
      - redis
  redis:
    image: redis:7-alpine

volumes:
  db_data:
